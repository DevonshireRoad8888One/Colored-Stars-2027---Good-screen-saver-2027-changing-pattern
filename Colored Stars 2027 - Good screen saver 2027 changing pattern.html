<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Night Screen Saver</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        .star {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
            transition: transform 12s ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <script>
        const numStars = 1200;
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F6'];
        const stars = [];

        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.transform = `translate(${Math.random() * 100}vw, ${Math.random() * 100}vh)`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            document.body.appendChild(star);
            stars.push(star);
        }

        setInterval(() => {
            for (const star of stars) {
                star.style.background = colors[Math.floor(Math.random() * colors.length)];
            }
        }, 2000);

        setInterval(() => {
            for (const star of stars) {
                star.style.transform = `translate(${Math.random() * 100}vw, ${Math.random() * 100}vh)`;
            }
        }, 12000);
    </script>
</body>
</html>
